<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f4f6fb;
        padding: 30px;
    }

    h2 {
        color: #1f2937;
    }

    form {
        max-width: 500px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    input, button {
        width: 100%;
        display: block;
        margin-bottom: 15px;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }
</style>

<h2>Cadastrar Produto</h2>

<form method="post">
    {% csrf_token %}
    <input type="text" name="nome" placeholder="Nome do produto">
    <input type="number" name="quantidade" placeholder="Quantidade">
    <input type="number" step="0.01" name="preco" placeholder="Preço">
    <button type="submit">Salvar</button>
</form>
