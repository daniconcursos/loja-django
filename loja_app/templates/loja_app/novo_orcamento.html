<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f4f6fb;
        padding: 30px;
    }

    h2 {
        color: #1f2937;
    }

    form {
        max-width: 500px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #374151;
    }

    input, select, button {
        width: 100%;
        display: block;
        margin-bottom: 15px;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }
</style>

<h2>Novo Orçamento</h2>

<form method="post">
    {% csrf_token %}

    <label>Cliente</label>
    <select name="cliente">
        {% for cliente in clientes %}
            <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
        {% endfor %}
    </select>

    <label>Descrição</label>
    <input type="text" name="descricao">

    <h3>Itens</h3>

    <label>Produto</label>
    <select name="produto">
        {% for produto in produtos %}
            <option value="{{ produto.id }}">{{ produto.nome }}</option>
        {% endfor %}
    </select>

    <label>Quantidade</label>
    <input type="number" name="quantidade" value="1">

    <label>Preço unitário</label>
    <input type="number" step="0.01" name="preco" placeholder="Preço unitário">

    <button type="submit">Salvar orçamento</button>
</form>
