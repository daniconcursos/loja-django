{% extends 'loja_app/base.html' %}

{% block content %}
<section class="panel">
    <div class="panel-header">
        {% if orcamento %}Alterar Orçamento #{{ orcamento.id }}{% else %}Novo Orçamento{% endif %}
    </div>

    <form method="post">
        {% csrf_token %}

        <label for="cliente">Cliente</label>
        <select id="cliente" name="cliente" required>
            {% for cliente in clientes %}
                <option value="{{ cliente.id }}" {% if orcamento and cliente.id == orcamento.cliente_id %}selected{% endif %}>
                    {{ cliente.nome }}
                </option>
            {% endfor %}
        </select>

        <label for="descricao">Descrição</label>
        <input id="descricao" type="text" name="descricao" value="{% if orcamento %}{{ orcamento.descricao }}{% endif %}">

        <h3>Produtos do orçamento</h3>

        <div id="itens-orcamento">
            {% for linha in linhas %}
            <div class="budget-item">
                <div>
                    <label>Produto
                        <select name="produto" required>
                            <option value="" {% if not linha.produto_id %}selected{% endif %}>Selecione um produto</option>
                            {% for produto in produtos %}
                                <option value="{{ produto.id }}" data-preco="{{ produto.preco }}" {% if produto.id == linha.produto_id %}selected{% endif %}>
                                    {{ produto.nome }}
                                </option>
                            {% endfor %}
                        </select>
                    </label>
                </div>
                <div>
                    <label>Quantidade
                        <input type="number" name="quantidade" value="{{ linha.quantidade }}" min="1" required>
                    </label>
                </div>
                <div>
                    <label>Preço unitário
                        <input type="number" step="0.01" name="preco" min="0" placeholder="Preço unitário" value="{{ linha.preco }}" required>
                    </label>
                </div>
                <button class="remove-item" type="button">Remover item</button>
            </div>
            {% endfor %}
        </div>

        <button id="adicionar-produto" type="button" {% if not produtos %}disabled{% endif %}>Adicionar produto</button>

        <div class="form-actions">
            <button type="submit">{% if orcamento %}Salvar alterações{% else %}Salvar orçamento{% endif %}</button>
            <a class="cancel-button" href="{% url 'orcamentos' %}">Cancelar</a>
        </div>
    </form>
</section>

<script>
    const itensOrcamento = document.getElementById("itens-orcamento");
    const botaoAdicionar = document.getElementById("adicionar-produto");

    function atualizarBotaoRemover() {
        const linhas = itensOrcamento.querySelectorAll(".budget-item");
        linhas.forEach((linha) => {
            linha.querySelector(".remove-item").disabled = linhas.length === 1;
        });
    }

    itensOrcamento.addEventListener("change", (event) => {
        if (event.target.matches('select[name="produto"]')) {
            const preco = event.target.selectedOptions[0].dataset.preco || "";
            event.target.closest(".budget-item").querySelector('input[name="preco"]').value = preco;
        }
    });

    itensOrcamento.addEventListener("click", (event) => {
        if (event.target.matches(".remove-item")) {
            event.target.closest(".budget-item").remove();
            atualizarBotaoRemover();
        }
    });

    botaoAdicionar.addEventListener("click", () => {
        const novaLinha = itensOrcamento.querySelector(".budget-item").cloneNode(true);
        novaLinha.querySelector('select[name="produto"]').selectedIndex = 0;
        novaLinha.querySelector('input[name="quantidade"]').value = "1";
        novaLinha.querySelector('input[name="preco"]').value = "";
        itensOrcamento.appendChild(novaLinha);
        atualizarBotaoRemover();
    });

    atualizarBotaoRemover();
</script>

<style>
    .budget-item {
        display: grid;
        grid-template-columns: minmax(180px, 2fr) minmax(100px, 1fr) minmax(140px, 1fr) auto;
        align-items: end;
        gap: 10px;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #ddd;
    }

    .budget-item input,
    .budget-item select {
        margin-bottom: 0;
    }

    .remove-item {
        margin-bottom: 0;
        border-color: #b54747;
        background: white;
        color: #9d3030;
    }

    #adicionar-produto:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    @media (max-width: 760px) {
        .budget-item {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 480px) {
        .budget-item {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}
