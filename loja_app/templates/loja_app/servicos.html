<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f4f6fb;
        padding: 30px;
    }

    h2 {
        color: #1f2937;
    }

    form {
        max-width: 500px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    input, select, textarea, button {
        width: 100%;
        display: block;
        margin-bottom: 15px;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
    }

    textarea {
        min-height: 90px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }
</style>

<h2>Nova Ordem de Serviço</h2>

<form method="post">
    {% csrf_token %}

    <select name="cliente">
        {% for cliente in clientes %}
            <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
        {% endfor %}
    </select>

    <textarea name="descricao" placeholder="Descrição da OS"></textarea>
    <input type="number" step="0.01" name="valor" placeholder="Valor">
    <select name="status">
        <option value="Pendente">Pendente</option>
        <option value="Concluido">Concluído</option>
    </select>

    <button type="submit">Salvar</button>
</form>
