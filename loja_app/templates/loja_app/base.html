<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAISQFIO - Sistema</title>
    
    <!-- Fonte e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* Paleta e Estética Exata do Admin / Darkly */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e1e1e; /* Fundo base fosco do Admin */
            color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar com a estética do cabeçalho do Admin */
        .header-nav {
            background-color: #2b2b2b;
            border-bottom: 1px solid #3a3a3a;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .header-brand i {
            color: #00bc8c;
        }

        .header-menu {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
        }

        .header-menu a {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .header-menu a:hover,
        .header-menu a.active {
            color: #00bc8c;
        }

        /* Layout centralizado e amplo */
        .page-wrapper {
            max-width: 1100px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        /* Cards idênticos aos painéis do Admin */
        .admin-card {
            background-color: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .admin-card-header {
            background-color: #333333;
            border-bottom: 1px solid #3a3a3a;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-card-body {
            padding: 22px;
        }

        /* Campos e Inputs no estilo Admin escuro */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin: -8px;
        }

        .form-col {
            padding: 8px;
        }

        .col-12 { width: 100%; }
        .col-8 { width: 66.66%; }
        .col-7 { width: 58.33%; }
        .col-5 { width: 41.66%; }
        .col-4 { width: 33.33%; }
        .col-3 { width: 25%; }
        .col-2 { width: 16.66%; }

        @media (max-width: 768px) {
            .col-8, .col-7, .col-5, .col-4, .col-3, .col-2 { width: 100%; }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 0.8rem;
            color: #9ca3af;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .field-group input {
            background-color: #1e1e1e;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field-group input:focus {
            border-color: #00bc8c;
            box-shadow: 0 0 0 1px #00bc8c;
        }

        /* Botões idênticos ao Admin */
        .btn-green {
            background-color: #00bc8c;
            color: #ffffff;
            border: none;
            padding: 9px 20px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-green:hover {
            background-color: #009670;
        }

        .btn-gray {
            background-color: #3f444a;
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 4px;
            font-size: 0.88rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }

        .btn-gray:hover {
            background-color: #4a5057;
        }

        /* Tabela no padrão Admin */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .admin-table th {
            background-color: #333333;
            color: #adb5bd;
            padding: 10px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #3a3a3a;
        }

        .admin-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #363636;
            color: #d1d5db;
        }

        .admin-table tr:hover td {
            background-color: #323232;
        }

        .badge-loc {
            background-color: #383d44;
            color: #00bc8c;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
        }

        .link-edit {
            color: #375a7f;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .link-edit:hover {
            color: #4f7cb0;
            text-decoration: underline;
        }

        /* Rodapé sutil */
        footer {
            text-align: center;
            padding: 18px;
            font-size: 0.78rem;
            color: #71717a;
            border-top: 1px solid #2b2b2b;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho Limpo exclusivo para a visão operacional pública -->
    <header class="header-nav">
        <a href="{% url 'index' %}" class="header-brand">
            <i class="fas fa-bolt"></i>
            <span>MAISQFIO</span>
        </a>

        <ul class="header-menu">
            <li><a href="{% url 'index' %}">Início</a></li>
            <li><a href="{% url 'clientes' %}" class="active">Clientes</a></li>
            <li><a href="/admin/">Acesso Restrito</a></li>
        </ul>
    </header>

    <!-- Área de Conteúdo -->
    <div class="page-wrapper">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        MAISQFIO Segurança Eletrônica & Elétrica &copy; 2026
    </footer>

</body>
</html>
